<!DOCTYPE html>
<html>
<head>
  <meta charset="UTF-8">
  <title>Login - ZedFits</title>
  <style>
    body{font-family:Arial; display:flex; justify-content:center; align-items:center; height:100vh; background:#f5f5f5}
    form{background:white; padding:30px; border-radius:12px; width:300px; box-shadow:0 4px 15px rgba(0,0,0,0.1)}
    input{width:100%; padding:10px; margin:8px 0; border:1px solid #ccc; border-radius:8px; box-sizing:border-box}
    button{width:100%; padding:10px; background:black; color:white; border:none; border-radius:8px; cursor:pointer; margin-top:10px}
    button:hover{background:#333}
    #errorMsg{color:red; display:none; margin-top:10px; text-align:center; font-size:14px}
    a{font-size:13px; text-align:center; display:block; margin-top:12px; color:#555}
  </style>
</head>
<body>

<form id="loginForm">
  <h2 style="text-align:center">Login to ZedFits</h2>
  <input type="email" id="email" placeholder="Email" required>
  <input type="password" id="password" placeholder="Password" required>
  <button type="submit">Login</button>
  <div id="errorMsg">Wrong email or password!</div>
  <a href="/zedfits-login-forms/sign-up.html">Don't have account? Sign Up</a>
</form>

<script>
document.getElementById('loginForm').onsubmit = function(e){
  e.preventDefault();

  const enteredEmail = document.getElementById('email').value.trim();
  const enteredPassword = document.getElementById('password').value;

  const savedEmail = localStorage.getItem('email');
  const savedPassword = localStorage.getItem('password');

  // If no one signed up yet
  if(!savedEmail){
    document.getElementById('errorMsg').innerText = 'No account found. Please Sign Up first.';
    document.getElementById('errorMsg').style.display = 'block';
    return;
  }

  // CHECK PASSWORD
  if(enteredEmail === savedEmail && enteredPassword === savedPassword){
    // CORRECT
    window.location.href = 'zedfits.html'; // open main page
  } else {
    // WRONG - won't open
    document.getElementById('errorMsg').innerText = 'Wrong email or password!';
    document.getElementById('errorMsg').style.display = 'block';
  }
};
</script>

</body>
</html>
