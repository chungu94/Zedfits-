<!DOCTYPE html>
<html>
<head>
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<style>


* { margin:0; padding:0; box-sizing:border-box; }
body { font-family: Arial; }

.top-bar{
  background:#0a2240;
  color:white;
  display:flex;
  justify-content:space-between;
  align-items:center;
  padding:14px 16px;
  position:relative;
}
.logo{display:flex;align-items:center;gap:8px;font-weight:bold}
.logo img{width:28px;height:28px;background:white;border-radius:3px}

details.mobile-dropdown{position:static}
details.mobile-dropdown summary{
  list-style:none;
  cursor:pointer;
  font-size:13px;
  font-weight:bold;
  letter-spacing:0.5px;
}
details.mobile-dropdown summary::-webkit-details-marker{display:none}

.dropdown-content{
  position:absolute;
  top:100%;
  left:0;
  width:100%;
  background:white;
  display:flex;
  flex-direction:column;
  box-shadow:0 10px 20px rgba(0,0,0,0.2);
  z-index:999;
}
.dropdown-content a{
  padding:16px;
  text-decoration:none;
  color:#0a2240;
  font-size:14px;
  font-weight:500;
  border-bottom:1px solid #eee;
}
</style>
</head>
<body>
  
  

<div class="top-bar">
  
  <div class="logo">
    <img src="logo.png"> ZED-FiTS
  
  </div>
  

  <details class="mobile-dropdown">
    <summary>SHOP ▼</summary>
    <div class="dropdown-content">
      <a href="#">EVERYTHING</a>
      <a href="#">WOMEN</a>
      <a href="#">MEN</a>
      <a href="#">ACCESSORIES</a>
    </div>
  </details>
</div>

</body>
</html>
